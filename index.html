<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>LS&amp;Co. To Go · Store Support (demo)</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="header" role="banner">
    <a class="wordmark" href="#/" aria-label="LS&amp;Co. To Go home">
      <span class="wm-ls">LS<br>&amp;CO.</span>
      <span class="wm-togo">TO GO »</span>
    </a>
    <form class="gsearch" id="gsearch" role="search" hidden>
      <label class="sr" for="gsearchInput">Search</label>
      <input id="gsearchInput" type="search" autocomplete="off">
    </form>
    <div class="hdr-right" id="hdrRight"></div>
  </header>

  <div class="app">
    <main id="main" class="main" tabindex="-1">
      <div id="banner"></div>
      <div id="outlet"></div>
      <footer class="footer" id="footer"></footer>
    </main>

  </div>

  <div class="presenter" id="presenter" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
