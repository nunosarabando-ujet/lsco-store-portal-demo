<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>LS&amp;Co. To Go · Store Support (demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="head">
    <a class="logo" href="#/home" aria-label="LS&amp;Co. To Go home">
      <span class="logo-ls">LS<br>&amp;CO.</span><span class="togo">TO GO »</span>
    </a>
    <div class="head-icons" id="head-icons">
      <a class="circle" href="#/home" title="Home" aria-label="Home">⌂</a>
      <button class="circle" id="lang-toggle" title="Language" aria-label="Switch language">PT</button>
      <span id="user-area"></span>
    </div>
  </header>
  <div class="outage" id="outage-banner" role="alert" hidden></div>

  <div class="layout">
    <main class="content" id="view" tabindex="-1"></main>

    <aside class="chat-panel" id="chat-panel" aria-label="Stitch virtual agent">
      <div class="chat-head">
        <div>
          <b class="chat-title">Stitch · LS&amp;Co. Store Support</b>
          <small class="chat-sub">AI assistant · Powered by UJET + Google CX Agent Studio</small>
          <span class="chat-badge" id="chat-status">Guest</span>
        </div>
        <button class="icon-btn" id="chat-close" aria-label="Close chat">✕</button>
      </div>
      <div class="chat-mount" id="chat-mount"></div>
    </aside>
  </div>

  <button class="chat-fab" id="chat-toggle" aria-label="Open chat">💬</button>

  <footer class="footer"><span id="footer-text"></span><span>Shift + P · presenter panel</span></footer>

  <div class="presenter" id="presenter" hidden>
    <div class="presenter-head"><b>Presenter panel</b><button data-p="close" aria-label="Close">✕</button></div>
    <div id="presenter-body"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
